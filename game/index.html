<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowkeeper — guard the last garden</title>
<meta name="description" content="Glowkeeper: a lantern spirit defends five glowblooms against ten waves of gloom. A complete offline browser game.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Glowkeeper: move with WASD or arrow keys, aim with the mouse, hold click or Space to shoot, dash with Shift. Guard the glowblooms through ten waves."></canvas>
<p id="live" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
